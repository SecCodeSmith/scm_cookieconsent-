name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  php-lint:
    name: PHP lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Module targets PHP 7.1+ (up to 8.1-8.4 on PrestaShop 9) — lint both ends.
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none

      - name: Lint all PHP files
        shell: bash
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

  build:
    name: Package module
    needs: php-lint
    # build.ps1 stages files with robocopy, which is Windows-only.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run build.ps1
        shell: pwsh
        run: ./build.ps1

      - name: Expand built zip for artifact upload
        # actions/upload-artifact wraps whatever it's given in its own zip for
        # browser download. Uploading the already-built .zip as-is would mean
        # downloading it from the Actions UI yields a zip-of-a-zip, and
        # installing that outer zip directly in PrestaShop fails with "this
        # file does not appear to be a valid module zip" since the installer
        # sees a single .zip entry instead of the scm_cookieconsent/ folder.
        # Expanding here so the artifact's root is dist/artifact/scm_cookieconsent
        # means the downloaded artifact zip IS the correctly-rooted, directly
        # installable module zip.
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath dist/artifact -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: scm_cookieconsent-build
          path: dist/artifact
          if-no-files-found: error
