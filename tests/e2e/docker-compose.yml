# E2E stack for scm_cookieconsent — PrestaShop 8.1 with demo catalog.
# Run from WSL through ./stack.sh (it also copies the module in and installs it).
name: scmcc-e2e

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: prestashop
      MARIADB_USER: prestashop
      MARIADB_PASSWORD: prestashop
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  shop:
    image: prestashop/prestashop:8.1-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SCM_E2E_PORT:-8088}:80"
    environment:
      DB_SERVER: db
      DB_NAME: prestashop
      DB_USER: prestashop
      DB_PASSWD: prestashop
      DB_PREFIX: ps_
      PS_INSTALL_AUTO: "1"
      PS_ERASE_DB: "0"   # the DB container is fresh per stack (down -v); the 8.1 installer does not re-create a dropped DB
      PS_DOMAIN: "localhost:${SCM_E2E_PORT:-8088}"
      PS_FOLDER_ADMIN: admin-e2e
      PS_FOLDER_INSTALL: install-e2e
      PS_LANGUAGE: en
      PS_COUNTRY: PL
      PS_DEV_MODE: "0"
      ADMIN_MAIL: e2e@example.com
      ADMIN_PASSWD: e2e-Passw0rd
